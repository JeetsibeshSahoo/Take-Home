version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: swarn_sathi_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swarn_sathi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swarn_sathi"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swarn_sathi_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/swarn_sathi?schema=public"
      JWT_SECRET: "swarn_sathi_secure_jwt_secret_dev_key_2026"
      MAGIC_CODE_EXPIRY_MINUTES: 10
      MAX_MAGIC_CODE_ATTEMPTS: 5
      RATE_LIMIT_WINDOW_MINUTES: 15
      RATE_LIMIT_MAX_REQUESTS: 5
      CLIENT_URL: "http://localhost:5173"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swarn_sathi_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local